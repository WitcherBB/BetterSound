plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    mixin {
        defaultRefmapName = "${mod_id}-forge.refmap.json"
    }
    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfigs "${mod_id}.mixins.json", "${mod_id}.forge.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

//sourceSets.main.resources { srcDir(project(':common').file('src/main/generated/resources')) }

def commonMain = project(':common').sourceSets.main.output
sourceSets.test {
    compileClasspath = commonMain + compileClasspath.filter { !it.name.startsWith('bettersound-common') }
    runtimeClasspath = commonMain + runtimeClasspath.filter { !it.name.startsWith('bettersound-common') }
}

dependencies {
    testImplementation project(':common')
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${mixinextras_version}"))

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    modRuntimeOnly "curse.maven:configured-457570:5180900"

    // JEI
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-forge:15.3.0.4"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly group: 'org.openjdk.nashorn', name: 'nashorn-core', version: '15.4'
    runtimeOnly group: 'org.openjdk.nashorn', name: 'nashorn-core', version: '15.4'
}

processResources {
    var expandProps = [
            'version'                           : version,
            'group'                             : project.group, //Else we target the task's group.
            'minecraft_version'                 : minecraft_version,
            'minecraft_version_range'           : minecraft_version_range,
            'fabric_version'                    : fabric_version,
            'fabric_loader_version'             : fabric_loader_version,
            'mod_name'                          : mod_name,
            'mod_author'                        : mod_author,
            'mod_id'                            : mod_id,
            'license'                           : license,
            'description'                       : project.description,
            "forge_version"                     : forge_version,
            "forge_loader_version_range"        : forge_loader_version_range,
            'credits'                           : credits,
            'java_version'                      : java_version,
            'architectury_version_range'        : architectury_version_range
    ]

    filesMatching(['META-INF/mods.toml', 'bettersound.forge.mixins.json']) {
        expand expandProps
    }

    inputs.properties expandProps

    from(project(':common').file('src/main/resources')) {
        include 'pack.mcmeta', 'logo.png'
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.mod_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}