# Project
mod_version=1.0.0
maven_group=com.witcherbb.bettersound
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Better Sound
mod_author=WitcherBB
mod_id=bettersound
license=MIT
credits=
description=Let's get better sound! \\nThe free Piano sound source used in this mod is Piano by mda.
minecraft_version_range=[1.20.1, 1.22)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.90.4+1.20.1
fabric_loader_version=0.16.9

# Forge
forge_version=47.3.5
forge_loader_version_range=[47,)

# Architectury API
architectury_version=9.2.14
architectury_version_range=[9.0, 10.0)
enabled_platforms=fabric,forge

# YACL
yacl_version=3.6.1

# Mod Menu
modmenu_version=7.2.2

# Network tuning for slow/blocked overseas maven repos: fail fast instead of hanging for minutes.
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=2
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.*|[::1]

## Environment Properties

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8
org.gradle.daemon=false