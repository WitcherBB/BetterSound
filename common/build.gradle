import groovy.json.JsonOutput
import groovy.json.JsonSlurper

architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/bettersound.accesswidener")
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/main/generated' }

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

//    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
//    // IMixinConfigPlugin 的方法签名用到 ASM 的 ClassNode；Mixin 的 POM 把 ASM 当"平台提供"，
//    // 而 common 模块的 classpath 里没有 Forge 那套库（forge 模块有，所以以前没暴露）。
//    // 版本与 Forge 1.20.1 (47.3.5) 用的 ASM 对齐；compileOnly，不进运行时。
//    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

def devResources = file('src/main/dev-resources')
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var expandProps = [
            'version'                           : version,
            'group'                             : project.group, //Else we target the task's group.
            'minecraft_version'                 : minecraft_version,
            'minecraft_version_range'           : minecraft_version_range,
            'fabric_version'                    : fabric_version,
            'fabric_loader_version'             : fabric_loader_version,
            'mod_name'                          : mod_name,
            'mod_author'                        : mod_author,
            'mod_id'                            : mod_id,
            'license'                           : license,
            'description'                       : project.description,
            "forge_version"                     : forge_version,
            "forge_loader_version_range"        : forge_loader_version_range,
            'credits'                           : credits,
            'java_version'                      : java_version,
            'architectury_version_range'        : architectury_version_range,
            'yacl_version'                      : yacl_version
    ]

    filesMatching(["bettersound.mixins.json"]) {
        expand expandProps
    }

    inputs.properties expandProps

    if (devResources.exists() && !project.hasProperty('release')) from 'src/main/dev-resources'

    doLast {
        if (project.hasProperty('release')) {
            return
        }
        def devSounds = new File(devResources, 'assets/bettersound/sounds.json')
        if (!devSounds.exists()) {
            logger.warn("file $devSounds does not exist.")
            return
        }

        def mainSounds = file('src/main/resources/assets/bettersound/sounds.json')
        def outFile = new File(destinationDir, 'assets/bettersound/sounds.json')

        def json = new JsonSlurper()
        def merged = new LinkedHashMap(json.parse(mainSounds, 'UTF-8') as Map)
        def dev = json.parse(devSounds, 'UTF-8') as Map

        dev.each {
            if (merged.containsKey(it.key)) {
                throw new GradleException("Key conflict in sounds.json: '$it.key' —— The main resource and dev-resources cannot be defined simultaneously.")
            }
            merged[it.key] = it.value
        }

        outFile.parentFile.mkdirs()
        outFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(merged)))
        logger.lifecycle("[BetterSound] sounds.json merged: main ${merged.size() - dev.size()} + dev ${dev.size()} = ${merged.size()} items.")
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.mod_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
